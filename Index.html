<body class="bg-slate-50 min-h-screen text-slate-800">
    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-4 mb-6">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">📍 Auckland Store Visit Guide</h1>
                <p class="text-indigo-200 text-sm mt-1">Mobile guide with GPS coordinate &amp; auto-converting Google Drive link support</p>
            </div>
            <!-- Action Buttons & Search -->
            <div class="flex flex-wrap sm:flex-row gap-2 w-full md:w-auto items-center">
                <input type="text" id="searchInput" placeholder="Search store name or address..." class="px-4 py-2 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 shadow-inner text-sm flex-1 sm:w-60">
                <button onclick="openModal()" class="bg-white text-indigo-600 hover:bg-indigo-50 font-semibold px-3 py-2 rounded-lg text-sm shadow transition flex items-center justify-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Add Store
                </button>
                <button onclick="resetToDefault()" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-3 py-2 rounded-lg text-sm shadow transition" title="Restore all stores to default">
                    🔄 Reset
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 pb-16">
        <!-- Brand Filter Tabs -->
        <div class="flex flex-wrap gap-2 mb-6 justify-center md:justify-start" id="brandTabs">
            <button onclick="filterBrand('all')" class="brand-btn active px-4 py-2 rounded-full text-sm font-semibold bg-indigo-600 text-white shadow transition">All</button>
            <button onclick="filterBrand('Noel Leeming')" class="brand-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">Noel Leeming</button>
            <button onclick="filterBrand('Harvey Norman')" class="brand-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">Harvey Norman</button>
            <button onclick="filterBrand('JB Hi-Fi')" class="brand-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">JB Hi-Fi</button>
            <button onclick="filterBrand('PB Tech')" class="brand-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">PB Tech</button>
            <button onclick="filterBrand('The Warehouse')" class="brand-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition">The Warehouse</button>
        </div>

        <!-- Store Grid -->
        <div id="storeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-slate-400 text-lg">No search results found.</p>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="storeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitle" class="text-xl font-bold text-slate-900 mb-4">Edit Store Information</h2>
            <form id="storeForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editIndex" value="13">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Select Brand</label>
                    <select id="formBrand" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Noel Leeming">Noel Leeming</option>
                        <option value="Harvey Norman">Harvey Norman</option>
                        <option value="JB Hi-Fi">JB Hi-Fi</option>
                        <option value="PB Tech">PB Tech</option>
                        <option value="The Warehouse">The Warehouse</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Store Name</label>
                    <input type="text" id="formName" required placeholder="e.g. Wairau Park" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Detailed Address (or GPS Coordinates like -36.84,174.76)</label>
                    <input type="text" id="formAddress" required placeholder="e.g. 3-5 Croftfield Lane or -36.789,174.745" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Contact Person (담당자 이름)</label>
                    <input type="text" id="formContactPerson" placeholder="e.g. John Smith" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
                    <input type="text" id="formPhone" placeholder="e.g. 09-123-4567" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Visit Notes &amp; Parking Tips</label>
                    <textarea id="formNote" rows="2" placeholder="e.g. Front parking / Easy access" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Map Image URL / Google Drive Link / File ID</label>
                    <input type="text" id="formMapUrl" placeholder="Paste Google Drive link, File ID, or Image URL" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex gap-2 justify-end">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white shadow transition">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Route Detail Modal -->
    <div id="routeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <h3 id="routeModalTitle" class="text-lg font-bold text-slate-900 mb-1">Route &amp; Map Details</h3>
            <p id="routeModalStore" class="text-xs text-indigo-600 font-semibold mb-4">Noel Leeming - St Lukes</p>
            <div id="routeModalContent" class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm text-slate-700 mb-6 space-y-3"></div>
            <div class="flex justify-end">
                <button onclick="closeRouteModal()" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white shadow transition">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-500 text-sm">
        <p>© 2026 Auckland Store Guide. Data is securely stored in your browser.</p>
    </footer>

            { brand: "Harvey Norman", name: "Wairau Park", address: "-36.770550609303044, 174.74009593875113", contactPerson: "Amrit", phone: "0279566555", note: "", mapImage: "", badgeBg: "bg-red-100 text-red-700" },
            { brand: "JB Hi-Fi", name: "Wairau Park", address: "-36.768742779038604, 174.73910602160527", contactPerson: "", phone: "", note: "", mapImage: "", badgeBg: "bg-amber-100 text-amber-800" },
            { brand: "Noel Leeming", name: "Warkworth", address: "-36.40489062627249, 174.64944211653503", contactPerson: "", phone: "", note: "", mapImage: "", badgeBg: "bg-blue-100 text-blue-700" },
            { brand: "Harvey Norman", name: "Westgate", address: "-36.812667397939485, 174.60933390096693", contactPerson: "", phone: "", note: "", mapImage: "", badgeBg: "bg-red-100 text-red-700" },
            { brand: "Noel Leeming", name: "Westgate", address: "-36.82013431554166, 174.61144377923944", contactPerson: "", phone: "", note: "", mapImage: "", badgeBg: "bg-blue-100 text-blue-700" },
            { brand: "JB Hi-Fi", name: "Westgate", address: "-36.809669143365646, 174.60529810466883", contactPerson: "", phone: "", note: "", mapImage: "", badgeBg: "bg-amber-100 text-amber-800" },
            { brand: "PB Tech", name: "Westgate", address: "7-9 Westgate Drive, Westgate", contactPerson: "", phone: "", note: "", mapImage: "", badgeBg: "bg-emerald-100 text-emerald-700" }
        ];

        let stores = JSON.parse(localStorage.getItem('auckland_stores_v5')) || defaultStores;
        let currentBrand = 'all';
        let searchQuery = '';

        function getBadgeColor(brand) {
            switch(brand) {
                case 'Noel Leeming': return 'bg-blue-100 text-blue-700';
                case 'Harvey Norman': return 'bg-red-100 text-red-700';
                case 'JB Hi-Fi': return 'bg-amber-100 text-amber-800';
                case 'PB Tech': return 'bg-emerald-100 text-emerald-700';
                case 'The Warehouse': return 'bg-rose-100 text-rose-700';
                default: return 'bg-slate-100 text-slate-700';
            }
        }

        function formatMapImageUrl(inputUrl) {
            if (!inputUrl) return '';
            inputUrl = inputUrl.trim();
            const fileIdMatch = inputUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (fileIdMatch && fileIdMatch[1]) {
                return ['https://lh3.googleusercontent.com/d/', fileIdMatch[1]].join('');
            }
            const idParamMatch = inputUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (idParamMatch && idParamMatch[1]) {
                return ['https://lh3.googleusercontent.com/d/', idParamMatch[1]].join('');
            }
            if (!inputUrl.startsWith('http') && /^[a-zA-Z0-9_-]{20,}$/.test(inputUrl)) {
                return ['https://lh3.googleusercontent.com/d/', inputUrl].join('');
            }
            return inputUrl;
        }

        function renderStores() {
            const grid = document.getElementById('storeGrid');
            const emptyState = document.getElementById('emptyState');
            
            const filtered = stores.map((store, originalIndex) => ({ ...store, originalIndex })).filter(store => {
                const matchesBrand = currentBrand === 'all' || store.brand === currentBrand;
                const matchesSearch = store.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      store.address.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      (store.contactPerson && store.contactPerson.toLowerCase().includes(searchQuery.toLowerCase())) ||
                                      (store.phone && store.phone.includes(searchQuery.toLowerCase())) ||
                                      store.note.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesBrand && matchesSearch;
            }).sort((a, b) => a.name.localeCompare(b.name));

            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(store => {
                const isCoord = /^-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?$/.test(store.address.trim());
                const mapUrl = isCoord 
                    ? ['https://www.google.com/maps/search/?api=1&query=', encodeURIComponent(store.address.trim())].join('')
                    : ['https://www.google.com/maps/search/?api=1&query=', encodeURIComponent(store.brand + ' ' + store.name + ' Auckland ' + store.address)].join('');
                
                const badgeClass = getBadgeColor(store.brand);

                const card = document.createElement('div');
                card.className = "bg-white rounded-xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">${store.brand}</span>
                            <div class="flex items-center gap-1">
                                <button onclick="openEditModal(${store.originalIndex})" class="text-slate-400 hover:text-indigo-600 p-1 transition" title="Edit Store Information">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </button>
                                <button onclick="deleteStore(${store.originalIndex})" class="text-slate-400 hover:text-red-600 p-1 transition" title="Delete">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">${store.name}</h3>
                        <p class="text-xs text-slate-500 mb-2 flex items-center gap-1">
                            <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            ${store.address}
                        </p>
                        ${store.contactPerson || store.phone ? `
                            <div class="text-xs text-slate-700 bg-indigo-50/50 p-2 rounded-lg border border-indigo-100 mb-2 space-y-1">
                                ${store.contactPerson ? `<div>👤 <span class="font-medium">Contact Person:</span> ${store.contactPerson}</div>` : ''}
                                ${store.phone ? `<div>📞 <span class="font-medium">Phone:</span> <a href="tel:${store.phone}" class="text-indigo-600 underline">${store.phone}</a></div>` : ''}
                            </div>
                        ` : ''}
                        ${store.note ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100 mb-3">💡 <span class="font-medium">Note:</span> ${store.note}</p>` : ''}
                    </div>
                    <div class="space-y-2">
                        <button onclick="openRouteModal(${store.originalIndex})" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium text-xs py-2.5 px-3 rounded-lg text-center transition flex items-center justify-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                            Detailed Route
                        </button>
                        <a href="${mapUrl}" target="_blank" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs py-2 px-3 rounded-lg text-center transition flex items-center justify-center gap-1.5">
                            Maps
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterBrand(brand) {
            currentBrand = brand;
            document.querySelectorAll('.brand-btn').forEach(btn => {
                if(btn.textContent.includes(brand) || (brand === 'all' && btn.textContent === 'All')) {
                    btn.className = "brand-btn active px-4 py-2 rounded-full text-sm font-semibold bg-indigo-600 text-white shadow transition";
                } else {
                    btn.className = "brand-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition";
                }
            });
            renderStores();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderStores();
        });

        function resetToDefault() {
            if (confirm('Are you sure you want to reset all changes and restore the default store list?')) {
                stores = [...defaultStores];
                localStorage.setItem('auckland_stores_v5', JSON.stringify(stores));
                renderStores();
                alert('Restored to default store list.');
            }
        }

        function openModal() {
            document.getElementById('modalTitle').textContent = 'Add Store';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('formBrand').value = 'Noel Leeming';
            document.getElementById('formName').value = '';
            document.getElementById('formAddress').value = '';
            document.getElementById('formContactPerson').value = '';
            document.getElementById('formPhone').value = '';
            document.getElementById('formNote').value = '';
            document.getElementById('formMapUrl').value = '';
            document.getElementById('storeModal').classList.remove('hidden');
            document.getElementById('storeModal').classList.add('flex');
        }

        function openEditModal(index) {
            const store = stores[index];
            document.getElementById('modalTitle').textContent = 'Edit Store Information';
            document.getElementById('editIndex').value = index;
            document.getElementById('formBrand').value = store.brand;
            document.getElementById('formName').value = store.name;
            document.getElementById('formAddress').value = store.address;
            document.getElementById('formContactPerson').value = store.contactPerson || '';
            document.getElementById('formPhone').value = store.phone || '';
            document.getElementById('formNote').value = store.note;
            document.getElementById('formMapUrl').value = store.mapImage || '';
            document.getElementById('storeModal').classList.remove('hidden');
            document.getElementById('storeModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('storeModal').classList.remove('flex');
            document.getElementById('storeModal').classList.add('hidden');
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            const brand = document.getElementById('formBrand').value;
            const name = document.getElementById('formName').value;
            const address = document.getElementById('formAddress').value;
            const contactPerson = document.getElementById('formContactPerson').value;
            const phone = document.getElementById('formPhone').value;
            const note = document.getElementById('formNote').value;
            const rawMapImage = document.getElementById('formMapUrl').value;
            const mapImage = formatMapImageUrl(rawMapImage);
            const badgeBg = getBadgeColor(brand);

            saveStoreData(index, { brand, name, address, contactPerson, phone, note, mapImage, badgeBg });
        }

        function saveStoreData(index, storeData) {
            if (index === -1) {
                stores.unshift(storeData);
            } else {
                stores[index] = storeData;
            }
            localStorage.setItem('auckland_stores_v5', JSON.stringify(stores));
            closeModal();
            renderStores();
        }

        function deleteStore(index) {
            if (confirm('Are you sure you want to delete this store?')) {
                stores.splice(index, 1);
                localStorage.setItem('auckland_stores_v5', JSON.stringify(stores));
                renderStores();
            }
        }

        function openRouteModal(index) {
            const store = stores[index];
            document.getElementById('routeModalStore').textContent = `${store.brand} - ${store.name}`;
            
            const contentDiv = document.getElementById('routeModalContent');
            let htmlContent = `<p><strong>📍 Address/Coordinates:</strong> ${store.address}</p>`;
            if (store.contactPerson) {
                htmlContent += `<p><strong>👤 Contact Person:</strong> ${store.contactPerson}</p>`;
            }
            if (store.phone) {
                htmlContent += `<p><strong>📞 Phone:</strong> <a href="tel:${store.phone}" class="text-indigo-600 underline">${store.phone}</a></p>`;
            }
            if (store.note) {
                htmlContent += `<p><strong>💡 Visit Notes & Parking Tips:</strong> ${store.note}</p>`;
            }
            if (store.mapImage) {
                htmlContent += ['<div class="mt-2"><strong class="block mb-1">🗺️ Attached Map / Route Image:</strong><img src="', store.mapImage, '" class="w-full rounded-xl border border-slate-200 shadow-sm" /></div>'].join('');
            } else {
                htmlContent += `<p class="text-slate-400 text-xs italic mt-2">No map image URL attached. Click edit to add one.</p>`;
            }

            contentDiv.innerHTML = htmlContent;
            document.getElementById('routeModal').classList.remove('hidden');
            document.getElementById('routeModal').classList.add('flex');
        }

        function closeRouteModal() {
            document.getElementById('routeModal').classList.remove('flex');
            document.getElementById('routeModal').classList.add('hidden');
        }

        renderStores();
    </script>
