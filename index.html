<script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzWR2h5-4PCt1oTwOvo1f6ba_nqcdBqbENljPyVJKkifR1A_vdSBn1W6tVgMmksLy_q/exec";
        const ADMIN_PASSWORD = "1234";

        function verifyAdmin() {
            const input = prompt("관리자 비밀번호를 입력하세요:");
            if (input === null) return false;
            if (input === ADMIN_PASSWORD) {
                return true;
            } else {
                alert("비밀번호가 틀렸습니다.");
                return false;
            }
        }

        const defaultStores = [
            { brand: "JB Hi-Fi", name: "Albany", address: "-36.72762792656039, 174.70722451771036", contactPerson: "", phone: "", note: "", mapImages: [] },
            { brand: "Noel Leeming", name: "Albany", address: "Albany Supa Centa, Don McKinnon Drive", contactPerson: "", phone: "", note: "", mapImages: [] },
            { brand: "PB Tech", name: "Albany", address: "-36.73071975188351, 174.7111733998866", contactPerson: "", phone: "", note: "", mapImages: [] }
        ];

        let stores = [];
        let currentBrand = 'all';
        let searchQuery = '';
        let activeEditImages = [];

        function getBadgeColor(brand) {
            switch(brand) {
                case 'Noel Leeming': return 'bg-blue-100 text-blue-700';
                case 'Harvey Norman': return 'bg-red-100 text-red-700';
                case 'JB Hi-Fi': return 'bg-amber-100 text-amber-800';
                case 'PB Tech': return 'bg-emerald-100 text-emerald-700';
                case 'The Warehouse': return 'bg-rose-100 text-rose-700';
                default: return 'bg-slate-100 text-slate-700';
            }
        }

        async function initApp() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            // 1순위: 브라우저 로컬 저장소(localStorage)에서 데이터 먼저 불러오기 (새로고침 유실 방지)
            const localData = localStorage.getItem('auckland_stores_cache');
            if (localData) {
                try {
                    stores = JSON.parse(localData);
                } catch(e) {
                    stores = [...defaultStores];
                }
            } else {
                stores = [...defaultStores];
            }

            // 2순위: 클라우드(Google Sheets) 최신 데이터 동기화 시도
            if (WEB_APP_URL && WEB_APP_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
                try {
                    const response = await fetch(WEB_APP_URL);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        stores = data.map(s => ({
                            ...s,
                            mapImages: s.mapImages || (s.mapImage ? [s.mapImage] : [])
                        }));
                        saveLocalCache(); // 최신 클라우드 데이터를 로컬에 갱신
                    }
                } catch (e) {
                    console.error("Cloud load failed, using local cache.", e);
                }
            }

            overlay.classList.remove('flex');
            overlay.classList.add('hidden');
            renderStores();
        }

        function saveLocalCache() {
            try {
                localStorage.setItem('auckland_stores_cache', JSON.stringify(stores));
            } catch (e) {
                console.error("Local storage quota exceeded (images too large).", e);
                alert("경고: 업로드된 이미지 용량이 너무 커서 브라우저 저장 공간을 초과했습니다. 이미지 개수나 크기를 줄여주세요.");
            }
        }

        async function syncToCloud() {
            // 항상 로컬에 먼저 저장하여 새로고침 시 안 날아가게 보장
            saveLocalCache();

            if (!WEB_APP_URL || WEB_APP_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") return;
            try {
                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(stores)
                });
            } catch (e) {
                console.error("Failed to sync to cloud", e);
            }
        }

        function renderStores() {
            const grid = document.getElementById('storeGrid');
            const emptyState = document.getElementById('emptyState');
            
            const filtered = stores.map((store, originalIndex) => ({ ...store, originalIndex })).filter(store => {
                const matchesBrand = currentBrand === 'all' || store.brand === currentBrand;
                const matchesSearch = store.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      store.address.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      (store.contactPerson && store.contactPerson.toLowerCase().includes(searchQuery.toLowerCase())) ||
                                      (store.phone && store.phone.includes(searchQuery.toLowerCase())) ||
                                      store.note.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesBrand && matchesSearch;
            }).sort((a, b) => a.name.localeCompare(b.name));

            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(store => {
                const isCoord = /^-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?$/.test(store.address.trim());
                const mapUrl = isCoord 
                    ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.address.trim())}`
                    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.brand + ' ' + store.name + ' Auckland ' + store.address)}`;
                
                const badgeClass = getBadgeColor(store.brand);
                const hasImages = store.mapImages && store.mapImages.length > 0;

                const card = document.createElement('div');
                card.className = "bg-white rounded-xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">${store.brand}</span>
                            <div class="flex items-center gap-1">
                                <button onclick="openEditModal(${store.originalIndex})" class="text-slate-400 hover:text-indigo-600 p-1 transition" title="Edit">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </button>
                                <button onclick="deleteStore(${store.originalIndex})" class="text-slate-400 hover:text-red-600 p-1 transition" title="Delete">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">${store.name}</h3>
                        <p class="text-xs text-slate-500 mb-2 flex items-center gap-1">
                            <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            ${store.address}
                        </p>
                        ${store.contactPerson || store.phone ? `
                            <div class="text-xs text-slate-700 bg-indigo-50/50 p-2 rounded-lg border border-indigo-100 mb-2 space-y-1">
                                ${store.contactPerson ? `<div>👤 <span class="font-medium">Contact:</span> ${store.contactPerson}</div>` : ''}
                                ${store.phone ? `<div>📞 <span class="font-medium">Phone:</span> <a href="tel:${store.phone}" class="text-indigo-600 underline">${store.phone}</a></div>` : ''}
                            </div>
                        ` : ''}
                        ${store.note ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100 mb-3">💡 <span class="font-medium">Note:</span> ${store.note}</p>` : ''}
                    </div>
                    <div class="space-y-2">
                        <button onclick="openRouteModal(${store.originalIndex})" class="w-full ${hasImages ? 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'} font-medium text-xs py-2.5 px-3 rounded-lg text-center transition flex items-center justify-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                            Detailed Route ${hasImages ? `(${store.mapImages.length})` : ''}
                        </button>
                        <a href="${mapUrl}" target="_blank" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs py-2 px-3 rounded-lg text-center transition flex items-center justify-center gap-1.5">
                            Maps
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterBrand(brand) {
            currentBrand = brand;
            document.querySelectorAll('.brand-btn').forEach(btn => {
                if(btn.textContent.includes(brand) || (brand === 'all' && btn.textContent === 'All')) {
                    btn.className = "brand-btn active px-4 py-2 rounded-full text-sm font-semibold bg-indigo-600 text-white shadow transition";
                } else {
                    btn.className = "brand-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm transition";
                }
            });
            renderStores();
        }

        document.getElementById('searchInput').addEventListener('input', async (e) => {
            const value = e.target.value;
            if (value.trim().toLowerCase() === 'reset') {
                if (!verifyAdmin()) { e.target.value = ''; searchQuery = ''; renderStores(); return; }
                if (confirm('Are you sure you want to reset all stores?')) {
                    stores = [...defaultStores];
                    localStorage.removeItem('auckland_stores_cache');
                    renderStores();
                    await syncToCloud();
                    alert('Restored and synced.');
                }
                e.target.value = ''; searchQuery = ''; renderStores();
                return;
            }
            searchQuery = value;
            renderStores();
        });

        function openModal() {
            if (!verifyAdmin()) return;
            document.getElementById('modalTitle').textContent = 'Add Store';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('formBrand').value = 'Noel Leeming';
            document.getElementById('formName').value = '';
            document.getElementById('formAddress').value = '';
            document.getElementById('formContactPerson').value = '';
            document.getElementById('formPhone').value = '';
            document.getElementById('formNote').value = '';
            document.getElementById('formFileImages').value = '';
            activeEditImages = [];
            renderImagePreviews();
            document.getElementById('storeModal').classList.remove('hidden');
            document.getElementById('storeModal').classList.add('flex');
        }

        function openEditModal(index) {
            if (!verifyAdmin()) return;
            const store = stores[index];
            document.getElementById('modalTitle').textContent = 'Edit Store Information';
            document.getElementById('editIndex').value = index;
            document.getElementById('formBrand').value = store.brand;
            document.getElementById('formName').value = store.name;
            document.getElementById('formAddress').value = store.address;
            document.getElementById('formContactPerson').value = store.contactPerson || '';
            document.getElementById('formPhone').value = store.phone || '';
            document.getElementById('formNote').value = store.note;
            document.getElementById('formFileImages').value = '';
            activeEditImages = store.mapImages ? [...store.mapImages] : [];
            renderImagePreviews();
            document.getElementById('storeModal').classList.remove('hidden');
            document.getElementById('storeModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('storeModal').classList.remove('flex');
            document.getElementById('storeModal').classList.add('hidden');
        }

        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressedDataUrl);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleFilesSelect(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            for (const file of Array.from(files)) {
                const compressedDataUrl = await compressImage(file, 800, 800, 0.7);
                activeEditImages.push(compressedDataUrl);
            }
            renderImagePreviews();
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';

            if (activeEditImages.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-400 italic self-center">No images selected yet.</span>';
                return;
            }

            activeEditImages.forEach((imgUrl, idx) => {
                const item = document.createElement('div');
                item.className = "relative bg-white border border-slate-200 rounded-lg p-1.5 flex flex-col items-center shadow-sm w-24 shrink-0";
                item.innerHTML = `
                    <img src="${imgUrl}" class="w-20 h-16 object-cover rounded mb-1 bg-slate-100">
                    <div class="flex items-center justify-between w-full text-xs">
                        <button type="button" onclick="moveImage(${idx}, -1)" class="px-1 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-slate-700" title="Move Left">◀</button>
                        <button type="button" onclick="removeImage(${idx})" class="px-1.5 py-0.5 bg-red-50 hover:bg-red-100 text-red-600 rounded font-bold" title="Delete">✕</button>
                        <button type="button" onclick="moveImage(${idx}, 1)" class="px-1 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-slate-700" title="Move Right">▶</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function removeImage(index) {
            activeEditImages.splice(index, 1);
            renderImagePreviews();
        }

        function moveImage(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= activeEditImages.length) return;
            const temp = activeEditImages[index];
            activeEditImages[index] = activeEditImages[newIndex];
            activeEditImages[newIndex] = temp;
            renderImagePreviews();
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            const brand = document.getElementById('formBrand').value;
            const name = document.getElementById('formName').value;
            const address = document.getElementById('formAddress').value;
            const contactPerson = document.getElementById('formContactPerson').value;
            const phone = document.getElementById('formPhone').value;
            const note = document.getElementById('formNote').value;
            const mapImages = [...activeEditImages];

            const storeData = { brand, name, address, contactPerson, phone, note, mapImages };

            if (index === -1) {
                stores.unshift(storeData);
            } else {
                stores[index] = storeData;
            }

            closeModal();
            renderStores();
            await syncToCloud();
        }

        async function deleteStore(index) {
            if (!verifyAdmin()) return;
            if (confirm('Are you sure you want to delete this store?')) {
                stores.splice(index, 1);
                renderStores();
                await syncToCloud();
            }
        }

        function openRouteModal(index) {
            const store = stores[index];
            document.getElementById('routeModalStore').textContent = `${store.brand} - ${store.name}`;
            
            const contentDiv = document.getElementById('routeModalContent');
            let htmlContent = `<p><strong>📍 Address:</strong> ${store.address}</p>`;
            if (store.contactPerson) {
                htmlContent += `<p><strong>👤 Contact:</strong> ${store.contactPerson}</p>`;
            }
            if (store.phone) {
                htmlContent += `<p><strong>📞 Phone:</strong> <a href="tel:${store.phone}" class="text-indigo-600 underline">${store.phone}</a></p>`;
            }
            if (store.note) {
                htmlContent += `<p><strong>💡 Note:</strong> ${store.note}</p>`;
            }
            
            if (store.mapImages && store.mapImages.length > 0) {
                htmlContent += '<div class="mt-3"><strong class="block mb-2">🗺️ Attached Map / Route Images:</strong><div class="grid grid-cols-2 gap-2">';
                store.mapImages.forEach((img, i) => {
                    htmlContent += `<div class="border rounded-lg p-1 bg-white shadow-xs"><img src="${img}" class="w-full h-32 object-cover rounded mb-1" /><span class="block text-center text-xs text-slate-400">Photo #${i+1}</span></div>`;
                });
                htmlContent += '</div></div>';
            } else {
                htmlContent += `<p class="text-slate-400 text-xs italic mt-2">No map images attached.</p>`;
            }

            contentDiv.innerHTML = htmlContent;
            document.getElementById('routeModal').classList.remove('hidden');
            document.getElementById('routeModal').classList.add('flex');
        }

        function closeRouteModal() {
            document.getElementById('routeModal').classList.remove('flex');
            document.getElementById('routeModal').classList.add('hidden');
        }

        initApp();
    </script>
